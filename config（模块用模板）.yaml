mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
mode: Rule
bind-address: '*'
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: error
find-process-mode: always
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true # 是否自动更新 geodata
geo-update-interval: 24 # 更新间隔，单位：小时
global-client-fingerprint: random
external-controller: 0.0.0.0:9090
external-ui: ./dashboard


profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

tun:
  exclude-uid: [10041,10112,10266,10303,10306,10311,10320,10321,10322,10325,10329,10330,10331,10345,10355,10370,10435,10444,99910330]
  enable: true
  device: meta
  stack: mixed
  dns-hijack: [any:53, tcp://any:53]
  udp-timeout: 300
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:Fake-IP-Filter"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxies:
  - {name: DNS_Hijack, type: dns}
  - name: WG
    type: wireguard
    private-key: 
    server: "dthv6.v6.army"
    port: 23366
    ip: 192.168.10.10/31
    #ipv6: fd01:5ca1:ab1e:80fa:ab85:6eea:213f:f4a5
    public-key: 
    allowed-ips: ['0.0.0.0/0']
    pre-shared-key: 
  # reserved: [209,98,59]  # 字符串格式也是合法的，如"U4An"
  # persistent-keepalive: 0
    udp: true
  # dialer-proxy: "ss1"  # 一个出站代理的标识。当值不为空时，将使用指定的 proxy/proxy-group 发出连接
    remote-dns-resolve: true # 强制dns远程解析，默认值为false
    dns: ["192.168.3.99"] # 仅在remote-dns-resolve为true时生效
    

proxy-groups:
  - name: 国外代理
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/All.svg"
    type: select
    proxies:
      - ALL·狮城地区
      - ALL·中国台湾
      - ALL·香港地区
      - ALL·日本地区
      - ALL·美国地区
      - ALL·其它地区
      - 国内直连
  
  - name: 国内直连
    type: select
    proxies: [DIRECT]
    include-all: true
    exclude-type: "dns"
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/China.png
  
  - name: WireGuard
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/China_Map.png
    proxies:
      - WG
      - 国外代理
      - 国内直连
  
  - name: 电报信息
    type: select
    proxies:
      - ALL·狮城地区
      - ALL·中国台湾
      - ALL·香港地区
      - ALL·日本地区
      - ALL·美国地区
      - ALL·其它地区
      - 国外代理
      - 国内直连
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png
  
  - name: 漏网之鱼
    type: select
    proxies: [国外代理,国内直连]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Final.png
  
  - name: ALL·日本地区
    type: url-test
    include-all: true
    url: http://connectivitycheck.platform.hicloud.com/generate_204
    interval: 300
    lazy: true
    tolerance: 50
    timeout: 2000
    disable-udp: false
    max-failed-times: 3
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/JP.svg"
    filter: "^(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)).*$"

  - name: ALL·中国台湾
    type: url-test
    include-all: true
    url: http://connectivitycheck.platform.hicloud.com/generate_204
    interval: 300
    lazy: true
    tolerance: 50
    timeout: 2000
    disable-udp: false
    max-failed-times: 3
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/CN.svg"
    filter: "^(?=.*(台|新北|彰化|TW|Taiwan|taipei)).*$"

  - name: ALL·香港地区
    type: url-test
    include-all: true
    url: http://connectivitycheck.platform.hicloud.com/generate_204
    interval: 300
    lazy: true
    tolerance: 50
    timeout: 2000
    disable-udp: false
    max-failed-times: 3
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/HK.svg"
    filter: "^(?=.*(港|HK|hk|Hong Kong|HongKong|hongkong)).*$"

  - name: ALL·美国地区
    type: url-test
    include-all: true
    url: http://connectivitycheck.platform.hicloud.com/generate_204
    interval: 300
    lazy: true
    tolerance: 50
    timeout: 2000
    disable-udp: false
    max-failed-times: 3
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/US.svg"
    filter: "^(?=.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)).*$"

  - name: ALL·狮城地区
    type: url-test
    include-all: true
    url: http://connectivitycheck.platform.hicloud.com/generate_204
    interval: 300
    lazy: true
    tolerance: 50
    timeout: 2000
    disable-udp: false
    max-failed-times: 3
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/Singapore.svg"
    filter: "^(?=.*(新加坡|坡|狮城|SG|Singapore)).*$"

  - name: ALL·其它地区
    type: url-test
    include-all: true
    url: http://connectivitycheck.platform.hicloud.com/generate_204
    interval: 300
    lazy: true
    tolerance: 50
    timeout: 2000
    disable-udp: false
    max-failed-times: 3
    icon: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@rm/Home/icon/Globe.svg"
    filter: "^(?!.*(港|HK|hk|Hong Kong|HongKong|hongkong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|台|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|灾|网易|Netease|套餐|重置|剩余|到期|订阅|群|账户|流量|有效期|时间|官网|拒绝|DNS|Ch|网址|售|防失)).*$"

rule-providers:
  Fake-IP-Filter:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/Fake-IP-Filter.mrs
    url: "https://ghfast.top/github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/fakeip-filter.mrs"
    proxy: DIRECT
  proxy_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/proxy_domain.mrs
    url: "https://ghfast.top/github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/proxy.mrs"
    proxy: DIRECT
  telegram_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ruleset.skk.moe/Clash/non_ip/telegram.txt
    path: ./rule_provider/telegram_non_ip.txt
    proxy: DIRECT
  telegram_ip:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ruleset.skk.moe/Clash/ip/telegram.txt
    path: ./rule_provider/telegram_ip.txt
    proxy: DIRECT
  cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./rule_provider/cn_ip.mrs
    url: "https://ghfast.top/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cn.mrs"
    proxy: DIRECT
  private_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./rule_provider/private_ip.mrs
    url: "https://ghfast.top/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/private.mrs"
    proxy: DIRECT
  cn_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/cn_domain.mrs
    url: "https://ghfast.top/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cn.mrs"
    proxy: DIRECT
  private_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/private_domain.mrs
    url: "https://ghfast.top/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs"
    proxy: DIRECT
  
rules:
  - DST-PORT,53,DNS_Hijack
  - IP-CIDR,192.168.1.0/24,WireGuard,no-resolve
  - IP-CIDR,192.168.3.0/24,WireGuard,no-resolve
  - RULE-SET,telegram_non_ip,电报信息
  - RULE-SET,telegram_ip,电报信息
  - RULE-SET,proxy_domain,国外代理
  - OR,((RULE-SET,cn_ip),(RULE-SET,cn_domain),(RULE-SET,private_ip),(RULE-SET,private_domain)),国内直连
  - MATCH,漏网之鱼
